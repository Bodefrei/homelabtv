services:
  homelabtv-backend:
    build: .
    container_name: homelabtv-backend
    restart: unless-stopped
    network_mode: host
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - TZ=Europe/Berlin
      - HOMELAB_DATA_DIR=/data
      - HOMELAB_ADMIN_TOKEN=${HOMELAB_ADMIN_TOKEN:-}
      - HOMELAB_ADMIN_AUTH_FAILURE_LIMIT=${HOMELAB_ADMIN_AUTH_FAILURE_LIMIT:-10}
      - HOMELAB_MDNS_ENABLED=${HOMELAB_MDNS_ENABLED:-true}
      - HOMELAB_XMLTV_URL=${HOMELAB_XMLTV_URL:-https://www.free-epg.de/api/epg/de.xml.gz}
      - HOMELAB_XMLTV_REFRESH_HOURS=${HOMELAB_XMLTV_REFRESH_HOURS:-12}
      - HOMELAB_XMLTV_KEEP_PAST_HOURS=${HOMELAB_XMLTV_KEEP_PAST_HOURS:-1}
      - HOMELAB_XMLTV_KEEP_FUTURE_HOURS=${HOMELAB_XMLTV_KEEP_FUTURE_HOURS:-30}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 30060"